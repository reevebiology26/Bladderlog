<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Bladder Bootcamp</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* Splash Screen Background */
        .dot-bg { background-image: radial-gradient(circle at center, rgba(255,255,255,0.2) 1px, transparent 1px); background-size: 20px 20px; }
        /* Slide Animations */
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .slide-right { animation: slideRight 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SAFE STORAGE WRAPPER (Prevents iframe sandbox crashes) ---
        const safeStorage = {
            getItem: (key) => {
                try { return localStorage.getItem(key); } 
                catch (e) { return null; }
            },
            setItem: (key, value) => {
                try { localStorage.setItem(key, value); } 
                catch (e) { console.warn("Storage blocked - expected in preview mode."); }
            },
            removeItem: (key) => {
                try { localStorage.removeItem(key); } 
                catch (e) {}
            }
        };

        // --- ERROR BOUNDARY ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-red-50 text-gray-800 flex flex-col items-center justify-center p-6 text-center">
                            <div className="text-6xl mb-4">⚠️</div>
                            <h2 className="text-3xl mb-4 font-black text-red-600">App Encountered an Issue</h2>
                            <p className="mb-6 text-gray-600 font-medium">The app encountered a conflict with saved data. Clearing the cache will reset it safely.</p>
                            <button 
                                onClick={() => {
                                    safeStorage.removeItem('tbb_logs');
                                    safeStorage.removeItem('tbb_drinks');
                                    window.location.reload();
                                }}
                                className="bg-red-600 text-white px-8 py-4 rounded-xl font-bold active:scale-95 transition shadow-lg border-b-4 border-red-800"
                            >
                                Clear Data & Restart
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- SWIPEABLE LOG COMPONENT ---
        const SwipeableLog = ({ onDelete, children, bgClass }) => {
            const [offset, setOffset] = useState(0);
            const touchStartX = useRef(null);

            const handleTouchStart = (e) => {
                touchStartX.current = e.touches ? e.touches[0].clientX : e.clientX;
            };

            const handleTouchMove = (e) => {
                if (touchStartX.current === null) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const diff = currentX - touchStartX.current;
                if (diff < 0) setOffset(Math.max(diff, -80));
                else setOffset(0);
            };

            const handleTouchEnd = () => {
                if (offset < -40) setOffset(-80);
                else setOffset(0);
                touchStartX.current = null;
            };

            return (
                <div className="relative overflow-hidden rounded-xl w-full touch-pan-y mb-3 shadow-sm">
                    <div className="absolute inset-0 bg-red-500 flex justify-end items-center rounded-xl">
                        <button 
                            onClick={(e) => {
                                e.stopPropagation();
                                setOffset(0);
                                onDelete();
                            }} 
                            className="text-white font-bold h-full px-6 flex items-center justify-center active:bg-red-600 transition-colors"
                        >
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    <div 
                        className={`relative w-full h-full transition-transform duration-200 ease-out rounded-xl ${bgClass}`}
                        style={{ transform: `translateX(${offset}px)` }}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                        onMouseDown={handleTouchStart}
                        onMouseMove={(e) => { if (e.buttons === 1) handleTouchMove(e); }}
                        onMouseUp={handleTouchEnd}
                        onMouseLeave={handleTouchEnd}
                    >
                        {children}
                    </div>
                </div>
            );
        };

        // --- PELVIC FLOOR TIMER COMPONENT ---
        const PelvicFloorTimer = () => {
            const [isActive, setIsActive] = useState(false);
            const [phase, setPhase] = useState('idle'); 
            const [timeLeft, setTimeLeft] = useState(10);
            const [rep, setRep] = useState(1);
            
            const totalReps = 10;
            const squeezeTime = 10; 
            const restTime = 10;    

            useEffect(() => {
                let interval = null;
                if (isActive && phase !== 'done') {
                    interval = setInterval(() => {
                        setTimeLeft((time) => {
                            if (time > 1) return time - 1;
                            if (phase === 'squeeze') {
                                setPhase('rest');
                                return restTime;
                            } else if (phase === 'rest') {
                                if (rep >= totalReps) {
                                    setPhase('done');
                                    setIsActive(false);
                                    return 0;
                                } else {
                                    setRep(r => r + 1);
                                    setPhase('squeeze');
                                    return squeezeTime;
                                }
                            }
                            return 0;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isActive, phase, rep]);

            const startTimer = () => {
                if (phase === 'idle' || phase === 'done') {
                    setPhase('squeeze');
                    setTimeLeft(squeezeTime);
                    setRep(1);
                }
                setIsActive(true);
            };

            const pauseTimer = () => setIsActive(false);
            const resetTimer = () => { setIsActive(false); setPhase('idle'); setTimeLeft(squeezeTime); setRep(1); };

            return (
                <div className="flex flex-col items-center justify-center space-y-8 py-6">
                    <div className="text-center space-y-2">
                        <h2 className="text-2xl font-black text-gray-800">Pelvic Floor Routine</h2>
                        <p className="text-gray-500 text-sm px-4">Do this 3 times a day. Squeeze, lift inward and upward, then fully relax.</p>
                    </div>
                    
                    <div className={`relative w-64 h-64 rounded-full flex flex-col items-center justify-center shadow-xl border-8 transition-colors duration-500 ${
                        phase === 'squeeze' ? 'border-green-500 bg-green-50' : 
                        phase === 'rest' ? 'border-blue-400 bg-blue-50' : 
                        phase === 'done' ? 'border-purple-500 bg-purple-50' : 'border-gray-200 bg-white'
                    }`}>
                        <div className="absolute top-8 text-sm font-bold text-gray-400 uppercase tracking-widest">
                            {phase === 'idle' ? 'Ready' : phase === 'done' ? 'Complete!' : `Rep ${rep} / ${totalReps}`}
                        </div>
                        <div className="text-7xl font-black text-gray-800 tabular-nums">
                            {phase === 'done' ? '🎉' : timeLeft}
                        </div>
                        <div className={`absolute bottom-8 font-bold text-lg transition-colors ${
                            phase === 'squeeze' ? 'text-green-600' : 
                            phase === 'rest' ? 'text-blue-600' : 'text-gray-500'
                        }`}>
                            {phase === 'squeeze' ? 'SQUEEZE & LIFT' : 
                             phase === 'rest' ? 'FULLY RELAX' : 
                             phase === 'done' ? 'Great Job!' : 'Tap Start'}
                        </div>
                    </div>

                    <div className="flex space-x-4 w-full px-4">
                        {!isActive && phase !== 'done' ? (
                            <button onClick={startTimer} className="flex-1 bg-blue-600 text-white py-4 rounded-xl font-bold text-lg active:scale-95 transition shadow-lg border-b-4 border-blue-800">
                                {phase === 'idle' ? 'Start Routine' : 'Resume'}
                            </button>
                        ) : phase !== 'done' ? (
                            <button onClick={pauseTimer} className="flex-1 bg-amber-500 text-white py-4 rounded-xl font-bold text-lg active:scale-95 transition shadow-lg border-b-4 border-amber-700">
                                Pause
                            </button>
                        )}
                        {phase !== 'idle' && (
                            <button onClick={resetTimer} className="px-6 bg-gray-200 text-gray-700 py-4 rounded-xl font-bold text-lg active:scale-95 transition shadow-sm border-b-4 border-gray-300">
                                Reset
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            // --- STATE ---
            const [showSplash, setShowSplash] = useState(true);
            const [activeTab, setActiveTab] = useState('logs');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            
            const [logs, setLogs] = useState([]);
            const [drinkLogs, setDrinkLogs] = useState([]);
            
            // Modal States
            const [showLogModal, setShowLogModal] = useState(false);
            const [logTime, setLogTime] = useState('');
            const [volume, setVolume] = useState(2); 
            const [urgency, setUrgency] = useState(3); 
            const [tags, setTags] = useState({ marksClothes: false, dribble: false, massage: false });
            
            const [celebrationMsg, setCelebrationMsg] = useState('');
            const fileInputRef = useRef(null);

            // Static configuration
            const DRINKS = [
                { type: 'Water', icon: '💧', bg: 'bg-blue-50', border: 'border-blue-200', text: 'text-blue-800' },
                { type: 'Tea', icon: '🫖', bg: 'bg-amber-50', border: 'border-amber-200', text: 'text-amber-800' },
                { type: 'Coffee', icon: '☕', bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-800' },
                { type: 'Decaf', icon: '🌿', bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-800' },
                { type: 'Moretti', icon: '🍺', bg: 'bg-yellow-50', border: 'border-yellow-300', text: 'text-yellow-800' },
                { type: 'Double Jameson', icon: '🥃', bg: 'bg-slate-100', border: 'border-slate-300', text: 'text-slate-800' }
            ];

            // --- INITIAL LOAD ---
            useEffect(() => {
                const savedLogs = safeStorage.getItem('tbb_logs');
                if (savedLogs) {
                    try {
                        const parsed = JSON.parse(savedLogs);
                        if (Array.isArray(parsed)) {
                            const safeLogs = parsed.map(l => ({ ...l, timestamp: new Date(l.timestamp) })).filter(l => !isNaN(l.timestamp.getTime()));
                            setLogs(safeLogs);
                        }
                    } catch (e) { console.error("Error parsing logs", e); }
                }
                
                const savedDrinks = safeStorage.getItem('tbb_drinks');
                if (savedDrinks) {
                    try {
                        const parsed = JSON.parse(savedDrinks);
                        if (Array.isArray(parsed)) {
                            const safeDrinks = parsed.map(d => ({ ...d, timestamp: new Date(d.timestamp) })).filter(d => !isNaN(d.timestamp.getTime()));
                            setDrinkLogs(safeDrinks);
                        }
                    } catch (e) { console.error("Error parsing drinks", e); }
                }
            }, []);

            // --- AUTO SAVE ---
            useEffect(() => {
                if (!showSplash) {
                    safeStorage.setItem('tbb_logs', JSON.stringify(logs));
                    safeStorage.setItem('tbb_drinks', JSON.stringify(drinkLogs));
                }
            }, [logs, drinkLogs, showSplash]);

            // --- CALCULATIONS ---
            const getAverageInterval = () => {
                if (logs.length < 2) return 0;
                let totalDiff = 0;
                let validIntervals = 0;
                
                const sorted = [...logs].map(l => ({ ts: l.timestamp.getTime() })).sort((a, b) => a.ts - b.ts);
                for (let i = 1; i < sorted.length; i++) {
                    const diffMs = sorted[i].ts - sorted[i-1].ts;
                    if (diffMs > 0 && diffMs < 10 * 60 * 60 * 1000) { // Valid if under 10 hours
                        totalDiff += diffMs;
                        validIntervals++;
                    }
                }
                return validIntervals > 0 ? (totalDiff / validIntervals) : 0;
            };

            const formatDuration = (ms) => {
                if (!ms || isNaN(ms)) return "N/A";
                const mins = Math.floor(ms / 60000);
                const hrs = Math.floor(mins / 60);
                const remainingMins = mins % 60;
                if (hrs === 0) return `${remainingMins}m`;
                return `${hrs}h ${remainingMins}m`;
            };

            // --- ACTIONS ---
            const openLogModal = () => {
                const now = new Date();
                const timeString = now.toTimeString().slice(0, 5); 
                
                setLogTime(timeString);
                setVolume(2);
                setUrgency(3);
                setTags({ marksClothes: false, dribble: false, massage: false });
                setShowLogModal(true);
            };

            const saveLog = () => {
                const now = new Date();
                const [hours, minutes] = logTime.split(':');
                let dateObj = new Date();
                
                if (hours && minutes) {
                    dateObj = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(hours), parseInt(minutes));
                    if (dateObj > now) dateObj.setDate(dateObj.getDate() - 1); // Assume yesterday if future time
                }
                
                const newLog = { id: Date.now(), timestamp: dateObj, volume, urgency, tags };
                const currentAvg = getAverageInterval();
                
                const sortedLogs = [...logs, newLog].sort((a, b) => b.timestamp.getTime() - a.timestamp.getTime());
                
                // Celebration Logic
                if (sortedLogs.length > 1 && sortedLogs[0].id === newLog.id) {
                    const newInterval = newLog.timestamp.getTime() - sortedLogs[1].timestamp.getTime();
                    if (currentAvg > 0 && newInterval > (currentAvg + 300000) && newInterval < (10*60*60*1000)) {
                        setCelebrationMsg("🎉 New Personal Best! You held it longer than average!");
                        setTimeout(() => setCelebrationMsg(''), 4000);
                    }
                }

                setLogs(sortedLogs);
                setShowLogModal(false);
            };

            const handleLogDrink = (type) => {
                const newDrink = { id: Date.now(), timestamp: new Date(), type };
                setDrinkLogs(prev => {
                    const updated = [newDrink, ...prev];
                    return updated.sort((a, b) => b.timestamp.getTime() - a.timestamp.getTime());
                });
                setCelebrationMsg(`✅ ${type} logged!`);
                setTimeout(() => setCelebrationMsg(''), 2000);
            };

            const handleDelete = (id, type) => {
                if (type === 'drink') setDrinkLogs(prev => prev.filter(d => d.id !== id));
                else setLogs(prev => prev.filter(l => l.id !== id));
            };

            // --- DATA MANAGEMENT ---
            const exportData = () => {
                const data = JSON.stringify({ logs, drinkLogs });
                const blob = new Blob([data], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `BladderTrainerBackup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.logs) setLogs(parsed.logs.map(l => ({...l, timestamp: new Date(l.timestamp)})));
                        if (parsed.drinkLogs) setDrinkLogs(parsed.drinkLogs.map(d => ({...d, timestamp: new Date(d.timestamp)})));
                        alert("Data successfully restored!");
                    } catch (err) {
                        alert("Error restoring data. Make sure it's a valid backup file.");
                    }
                };
                reader.readAsText(file);
            };

            const daysUntilAudit = 14 - (new Date().getDate() % 14);

            const combinedEvents = [
                ...logs.map(l => ({ ...l, eventType: 'visit', tsTime: l.timestamp.getTime() })),
                ...drinkLogs.map(d => ({ ...d, eventType: 'drink', tsTime: d.timestamp.getTime() }))
            ].sort((a, b) => b.tsTime - a.tsTime);

            // --- RENDERING ---
            if (showSplash) {
                return (
                    <div 
                        className="max-w-md mx-auto min-h-screen bg-blue-600 flex flex-col items-center justify-center text-white relative overflow-hidden dot-bg cursor-pointer"
                        onClick={() => setShowSplash(false)}
                    >
                        <div className="text-7xl mb-6 animate-bounce flex items-center justify-center gap-4">
                            <span style={{ transform: 'scaleX(-1)', display: 'inline-block' }}>🚽</span>
                            <span style={{ transform: 'scaleX(-1)', display: 'inline-block' }}>🏃‍♂️💨</span>
                        </div>
                        <h1 className="text-3xl font-black text-center mb-2 px-4 drop-shadow-md">Operation<br/>Bladder Trainer</h1>
                        <p className="text-blue-200 font-medium tracking-wide">Teacher Bootcamp</p>
                        <div className="mt-16 text-sm text-white/80 animate-pulse font-bold tracking-widest uppercase bg-white/20 px-6 py-3 rounded-full">Tap anywhere to start</div>
                    </div>
                );
            }

            return (
                <div className="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col relative shadow-xl overflow-hidden text-gray-800">
                    
                    {/* Celebration Toast */}
                    {celebrationMsg && (
                        <div className="absolute top-4 left-4 right-4 z-50 bg-green-500 text-white font-bold px-4 py-3 rounded-xl shadow-lg flex items-center justify-center animate-pulse">
                            {celebrationMsg}
                        </div>
                    )}

                    {/* SIDEBAR OVERLAY */}
                    {isSidebarOpen && (
                        <div className="absolute inset-0 z-40 flex">
                            <div className="absolute inset-0 bg-black/50 backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>
                            <div className="relative w-64 bg-white h-full shadow-2xl flex flex-col z-50 slide-right">
                                <div className="p-6 bg-blue-600 text-white flex justify-between items-start">
                                    <div>
                                        <h2 className="text-xl font-bold">Menu</h2>
                                        <p className="text-blue-200 text-sm">{daysUntilAudit} days to next audit</p>
                                    </div>
                                    <button onClick={() => setIsSidebarOpen(false)} className="text-white/70 hover:text-white p-1">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                                <div className="flex flex-col py-4 space-y-2 px-3 flex-1">
                                    {[
                                        { id: 'logs', icon: '📝', label: 'Dashboard' },
                                        { id: 'progress', icon: '📈', label: 'Progress Data' },
                                        { id: 'calendar', icon: '📅', label: 'Calendar' },
                                        { id: 'exercises', icon: '⏱️', label: 'Exercises' }
                                    ].map(tab => (
                                        <button 
                                            key={tab.id}
                                            onClick={() => { setActiveTab(tab.id); setIsSidebarOpen(false); }}
                                            className={`flex items-center p-3 rounded-xl transition ${activeTab === tab.id ? 'bg-blue-50 text-blue-700 font-bold' : 'text-gray-600 hover:bg-gray-100'}`}
                                        >
                                            <span className="text-2xl mr-4">{tab.icon}</span>
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* HEADER */}
                    <header className="bg-white px-4 py-4 flex items-center justify-between shadow-sm z-10 sticky top-0 border-b border-gray-100">
                        <button onClick={() => setIsSidebarOpen(true)} className="p-2 -ml-2 text-gray-800 hover:bg-gray-100 rounded-lg transition-colors">
                            <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                        <h1 className="text-lg font-bold text-gray-800 tracking-tight">
                            {activeTab === 'logs' ? 'Dashboard' : activeTab === 'progress' ? 'Progress' : activeTab === 'calendar' ? 'Calendar' : 'Exercises'}
                        </h1>
                        <div className="w-8">
                            <div className="bg-blue-100 text-blue-700 text-xs font-black px-2 py-1 rounded-lg text-center">
                                {daysUntilAudit}d
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    <main className="flex-1 overflow-y-auto p-4 pb-12 hide-scrollbar">
                        
                        {activeTab === 'logs' && (
                            <div className="space-y-6">
                                {/* MASSIVE LOG BUTTON - MOVED AWAY FROM FINGERPRINT SENSOR */}
                                <button 
                                    onClick={openLogModal}
                                    className="w-full bg-blue-600 text-white py-5 rounded-2xl shadow-lg font-black text-xl active:scale-95 transition flex items-center justify-center space-x-3 border-b-4 border-blue-800"
                                >
                                    <span className="text-2xl">🚽</span>
                                    <span>Log Toilet Visit</span>
                                </button>

                                {/* DRINKS GRID */}
                                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Quick Add Drink</h3>
                                    <div className="grid grid-cols-3 gap-2">
                                        {DRINKS.map(drink => (
                                            <button 
                                                key={drink.type}
                                                onClick={() => handleLogDrink(drink.type)} 
                                                className={`py-3 ${drink.bg} border ${drink.border} ${drink.text} rounded-xl font-bold flex flex-col items-center justify-center space-y-1 active:scale-95 transition text-center px-1`}
                                            >
                                                <span className="text-xl">{drink.icon}</span>
                                                <span className={drink.type === 'Double Jameson' ? 'text-[10px] leading-tight' : 'text-xs'}>{drink.type}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* COMBINED TIMELINE */}
                                <div>
                                    <div className="flex justify-between items-baseline mb-4 px-1">
                                        <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Recent Activity</h3>
                                        <span className="text-[10px] text-gray-400 italic bg-gray-200 px-2 py-1 rounded-full">Swipe left to delete 👈</span>
                                    </div>
                                    
                                    {combinedEvents.length === 0 ? (
                                        <div className="text-center py-10 bg-white rounded-xl border border-dashed border-gray-300 text-gray-400">
                                            No activity logged yet.
                                        </div>
                                    ) : (
                                        <div>
                                            {combinedEvents.map((event) => {
                                                const eventDate = new Date(event.timestamp);
                                                const timeStr = !isNaN(eventDate.getTime()) ? eventDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "Unknown";
                                                
                                                if (event.eventType === 'drink') {
                                                    const drinkInfo = DRINKS.find(d => d.type === event.type) || { icon: '🥤' };
                                                    return (
                                                        <SwipeableLog key={`drink-${event.id}`} onDelete={() => handleDelete(event.id, 'drink')} bgClass="bg-blue-50 border-blue-100">
                                                            <div className="p-3 flex justify-between items-center border border-blue-100 rounded-xl h-full">
                                                                <div className="flex items-center space-x-3">
                                                                    <div className="bg-white p-2 rounded-lg shadow-sm text-lg">
                                                                        {drinkInfo.icon}
                                                                    </div>
                                                                    <span className="font-bold text-gray-700">{event.type}</span>
                                                                </div>
                                                                <span className="text-sm font-medium text-gray-500">{timeStr}</span>
                                                            </div>
                                                        </SwipeableLog>
                                                    );
                                                }

                                                // Visit processing
                                                const visitsOnly = logs.map(l => ({...l, ts: l.timestamp.getTime()})).sort((a, b) => b.ts - a.ts);
                                                const visitIndex = visitsOnly.findIndex(v => v.id === event.id);
                                                const prevLog = visitsOnly[visitIndex + 1];
                                                const interval = prevLog ? (event.tsTime - prevLog.ts) : null;
                                                
                                                return (
                                                    <SwipeableLog key={`visit-${event.id}`} onDelete={() => handleDelete(event.id, 'visit')} bgClass="bg-white border-gray-200">
                                                        <div className="p-4 flex flex-col border border-gray-200 rounded-xl h-full">
                                                            <div className="flex justify-between items-start mb-2">
                                                                <div className="flex items-center space-x-2">
                                                                    <span className="text-xl text-blue-600">🚽</span>
                                                                    <div className="font-black text-xl text-gray-800">{timeStr}</div>
                                                                </div>
                                                                <div className="text-sm font-bold bg-gray-100 px-3 py-1 rounded-lg text-gray-600">
                                                                    {interval ? formatDuration(interval) : 'Initial'}
                                                                </div>
                                                            </div>
                                                            
                                                            <div className="flex items-center space-x-4 text-sm mb-3 ml-8">
                                                                <div className="flex items-center space-x-1">
                                                                    <span className="text-gray-500 font-medium">Urge:</span>
                                                                    <span className={`font-bold px-2 py-0.5 rounded ${event.urgency >= 4 ? 'text-red-700 bg-red-100' : event.urgency === 3 ? 'text-orange-700 bg-orange-100' : 'text-green-700 bg-green-100'}`}>
                                                                        {event.urgency}/5
                                                                    </span>
                                                                </div>
                                                                <div className="flex items-center space-x-1">
                                                                    <span className="text-gray-500 font-medium">Vol:</span>
                                                                    <span className="font-bold text-gray-700 bg-gray-100 px-2 py-0.5 rounded">
                                                                        {event.volume === 1 ? 'Small' : event.volume === 2 ? 'Med' : 'Large'}
                                                                    </span>
                                                                </div>
                                                            </div>

                                                            {event.tags && (event.tags.dribble || event.tags.marksClothes || event.tags.massage) && (
                                                                <div className="flex flex-wrap gap-2 pt-3 border-t border-gray-100 ml-8">
                                                                    {event.tags.dribble && <span className="text-[10px] uppercase tracking-wider bg-blue-100 text-blue-800 px-2 py-1 rounded font-black">💧 Dribble</span>}
                                                                    {event.tags.marksClothes && <span className="text-[10px] uppercase tracking-wider bg-red-100 text-red-800 px-2 py-1 rounded font-black">👖 Marked Clothes</span>}
                                                                    {event.tags.massage && <span className="text-[10px] uppercase tracking-wider bg-purple-100 text-purple-800 px-2 py-1 rounded font-black">💆‍♂️ Massage</span>}
                                                                </div>
                                                            )}
                                                        </div>
                                                    </SwipeableLog>
                                                )
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'progress' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-blue-100">
                                        <p className="text-xs text-blue-500 font-bold uppercase mb-1">Avg Interval</p>
                                        <p className="text-2xl font-black text-gray-800">{formatDuration(getAverageInterval())}</p>
                                    </div>
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-green-100">
                                        <p className="text-xs text-green-500 font-bold uppercase mb-1">Total Logs</p>
                                        <p className="text-2xl font-black text-gray-800">{logs.length}</p>
                                    </div>
                                </div>

                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-gray-800 mb-4">Data Management</h3>
                                    <p className="text-sm text-gray-500 mb-6">Create hard backups on your phone so you never lose your 10-month progress.</p>
                                    
                                    <div className="space-y-3">
                                        <button onClick={exportData} className="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl flex items-center justify-center border border-gray-300">
                                            <span className="mr-2 text-xl">💾</span> Download Backup
                                        </button>
                                        
                                        <div className="relative">
                                            <input 
                                                type="file" 
                                                ref={fileInputRef}
                                                onChange={importData}
                                                accept=".json"
                                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                            />
                                            <button className="w-full py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl flex items-center justify-center">
                                                <span className="mr-2 text-xl">📂</span> Restore Backup
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'calendar' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-br from-blue-600 to-blue-800 p-8 rounded-3xl shadow-lg text-white text-center">
                                    <p className="text-blue-200 font-bold mb-2 uppercase tracking-widest text-sm">Next Audit Window</p>
                                    <div className="text-7xl font-black mb-2">{daysUntilAudit}</div>
                                    <p className="text-xl font-bold">Days Remaining</p>
                                </div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                    <h3 className="font-bold text-gray-800 mb-2">Audit Schedule</h3>
                                    <p className="text-sm text-gray-500">Log continuously on Monday, Tuesday, and Wednesday every two weeks to build your trend lines without burnout.</p>
                                </div>
                            </div>
                        )}

                        {activeTab === 'exercises' && (
                            <PelvicFloorTimer />
                        )}
                    </main>

                    {/* --- LOG MODAL OVERLAY --- */}
                    {showLogModal && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 sm:items-center backdrop-blur-sm">
                            <div className="bg-white w-full max-w-md p-6 rounded-t-3xl sm:rounded-3xl max-h-[95vh] overflow-y-auto slide-up pb-10">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-black text-gray-800">Log Toilet Visit</h2>
                                    <button onClick={() => setShowLogModal(false)} className="text-gray-400 bg-gray-100 rounded-full p-2 hover:bg-gray-200 transition-colors">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>

                                <div className="space-y-6">
                                    {/* PROMINENT TIME ADJUSTER */}
                                    <div className="bg-gray-50 py-4 px-4 rounded-2xl border-2 border-gray-200">
                                        <label className="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1 text-center">Time of Visit</label>
                                        <input 
                                            type="time" 
                                            value={logTime}
                                            onChange={(e) => setLogTime(e.target.value)}
                                            className="w-full text-5xl font-black text-center bg-transparent outline-none text-blue-600 cursor-pointer"
                                        />
                                    </div>

                                    {/* VOLUME SLIDER */}
                                    <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                                        <div className="flex justify-between text-sm font-bold text-gray-700 mb-3">
                                            <label>Volume</label>
                                            <span className="text-blue-600 font-black">{volume === 1 ? 'Small' : volume === 2 ? 'Medium' : 'Large'}</span>
                                        </div>
                                        <input 
                                            type="range" min="1" max="3" step="1" 
                                            value={volume} onChange={(e) => setVolume(parseInt(e.target.value))}
                                            className="w-full h-3 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                        />
                                        <div className="flex justify-between text-xs text-gray-400 mt-2 px-1 font-bold">
                                            <span>Small</span><span>Med</span><span>Large</span>
                                        </div>
                                    </div>

                                    {/* URGENCY SLIDER */}
                                    <div className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm">
                                        <div className="flex justify-between text-sm font-bold text-gray-700 mb-3">
                                            <label>Urgency Level</label>
                                            <span className={`font-black ${urgency >= 4 ? 'text-red-600' : urgency === 3 ? 'text-orange-600' : 'text-green-600'}`}>
                                                {urgency}/5
                                            </span>
                                        </div>
                                        <input 
                                            type="range" min="1" max="5" step="1" 
                                            value={urgency} onChange={(e) => setUrgency(parseInt(e.target.value))}
                                            className={`w-full h-3 rounded-lg appearance-none cursor-pointer ${urgency >= 4 ? 'accent-red-500 bg-red-100' : urgency === 3 ? 'accent-orange-500 bg-orange-100' : 'accent-green-500 bg-green-100'}`}
                                        />
                                        <div className="flex justify-between text-xs text-gray-400 mt-2 px-1 font-bold">
                                            <span>Mild</span><span>Rush!</span>
                                        </div>
                                    </div>

                                    {/* TAGS */}
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-3">Quick Tags</label>
                                        <div className="grid grid-cols-3 gap-3">
                                            <button 
                                                onClick={() => setTags({...tags, dribble: !tags.dribble})}
                                                className={`py-3 rounded-xl border-2 text-xs font-bold flex flex-col items-center justify-center transition-colors ${tags.dribble ? 'bg-blue-100 border-blue-400 text-blue-800' : 'bg-white border-gray-100 text-gray-500 shadow-sm'}`}
                                            >
                                                <span className="text-2xl mb-1">💧</span> Dribble
                                            </button>
                                            <button 
                                                onClick={() => setTags({...tags, marksClothes: !tags.marksClothes})}
                                                className={`py-3 rounded-xl border-2 text-[10px] font-bold flex flex-col items-center justify-center transition-colors text-center px-1 ${tags.marksClothes ? 'bg-red-100 border-red-400 text-red-800' : 'bg-white border-gray-100 text-gray-500 shadow-sm'}`}
                                            >
                                                <span className="text-2xl mb-1">👖</span> Marks Clothes
                                            </button>
                                            <button 
                                                onClick={() => setTags({...tags, massage: !tags.massage})}
                                                className={`py-3 rounded-xl border-2 text-xs font-bold flex flex-col items-center justify-center transition-colors ${tags.massage ? 'bg-purple-100 border-purple-400 text-purple-800' : 'bg-white border-gray-100 text-gray-500 shadow-sm'}`}
                                            >
                                                <span className="text-2xl mb-1">💆‍♂️</span> Massage
                                            </button>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={saveLog}
                                        className="w-full bg-blue-600 text-white py-5 rounded-xl font-black text-lg active:scale-95 transition shadow-lg mt-4 border-b-4 border-blue-800"
                                    >
                                        Save Log
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>

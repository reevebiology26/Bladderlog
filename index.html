<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Bladder Bootcamp</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .dot-bg { background-image: radial-gradient(circle at center, rgba(255,255,255,0.2) 1px, transparent 1px); background-size: 20px 20px; }
        
        /* Smooth Slide Animations */
        .slide-right { animation: slideRight 0.3s ease-out forwards; }
        @keyframes slideRight { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-900 print:bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // DRINKS MENU (12 Items for a perfect grid)
        const DRINKS_MENU = [
            { type: 'Water', icon: '💧', color: 'text-blue-600', bg: 'bg-blue-50 border-blue-200', vol: '250ml' },
            { type: 'Tea', icon: '🫖', color: 'text-amber-600', bg: 'bg-amber-50 border-amber-200', vol: '250ml' },
            { type: 'Coffee', icon: '☕', color: 'text-orange-600', bg: 'bg-orange-50 border-orange-200', vol: '250ml' },
            { type: 'Decaf Tea', icon: '🌿', color: 'text-emerald-600', bg: 'bg-emerald-50 border-emerald-200', vol: '250ml' },
            { type: 'Decaf Coffee', icon: '☕', color: 'text-emerald-600', bg: 'bg-emerald-50 border-emerald-200', vol: '250ml' },
            { type: 'Red Wine', icon: '🍷', color: 'text-rose-600', bg: 'bg-rose-50 border-rose-200', vol: '175ml' },
            { type: 'Moretti', icon: '🍺', color: 'text-yellow-600', bg: 'bg-yellow-50 border-yellow-200', vol: 'Pint (568ml)' },
            { type: 'Double Jameson', icon: '🥃', color: 'text-slate-600', bg: 'bg-slate-50 border-slate-200', vol: '50ml' },
            { type: 'Espresso', icon: '☕', color: 'text-stone-800', bg: 'bg-stone-100 border-stone-300', vol: '30ml' },
            { type: 'Orange Juice', icon: '🍊', color: 'text-orange-500', bg: 'bg-orange-50 border-orange-200', vol: '200ml' },
            { type: 'Smoothie', icon: '🥤', color: 'text-fuchsia-600', bg: 'bg-fuchsia-50 border-fuchsia-200', vol: '250ml' },
            { type: 'Milk', icon: '🥛', color: 'text-gray-600', bg: 'bg-gray-50 border-gray-200', vol: '200ml' }
        ];

        // --- SWIPEABLE LOG COMPONENT ---
        const SwipeableLog = ({ onDelete, children, bgClass }) => {
            const [offset, setOffset] = useState(0);
            const touchStartX = useRef(null);

            const handleTouchStart = (e) => {
                touchStartX.current = e.touches ? e.touches[0].clientX : e.clientX;
            };

            const handleTouchMove = (e) => {
                if (touchStartX.current === null) return;
                const currentX = e.touches ? e.touches[0].clientX : e.clientX;
                const diff = currentX - touchStartX.current;
                
                if (diff < 0) setOffset(Math.max(diff, -80));
                else setOffset(0);
            };

            const handleTouchEnd = () => {
                if (offset < -40) setOffset(-80);
                else setOffset(0);
                touchStartX.current = null;
            };

            return (
                <div className="relative overflow-hidden rounded-xl w-full touch-pan-y mb-3 shadow-sm print:hidden">
                    <div className="absolute inset-0 bg-red-500 flex justify-end items-center">
                        <button 
                            onClick={(e) => { e.stopPropagation(); setOffset(0); onDelete(); }} 
                            className="text-white font-bold h-full px-6 flex items-center justify-center active:bg-red-600 transition-colors"
                        >
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                    <div 
                        className={`relative w-full h-full transition-transform duration-200 ease-out ${bgClass}`}
                        style={{ transform: `translateX(${offset}px)` }}
                        onTouchStart={handleTouchStart}
                        onTouchMove={handleTouchMove}
                        onTouchEnd={handleTouchEnd}
                    >
                        {children}
                    </div>
                </div>
            );
        };

        function App() {
            // --- APP STATE ---
            const [showSplash, setShowSplash] = useState(true);
            const [activeTab, setActiveTab] = useState('logs');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [showAllData, setShowAllData] = useState(false);
            const [celebrationMsg, setCelebrationMsg] = useState('');
            
            // --- DATA STATE ---
            const [logs, setLogs] = useState([]);
            const [drinkLogs, setDrinkLogs] = useState([]);
            const [trackingMode, setTrackingMode] = useState('scheduled'); // 'scheduled' or 'continuous'
            const [auditStartDate, setAuditStartDate] = useState(() => {
                const d = new Date();
                return new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().slice(0, 10);
            });
            
            // --- MODAL STATE ---
            const [showLogModal, setShowLogModal] = useState(false);
            const [logDate, setLogDate] = useState('');
            const [logTime, setLogTime] = useState('');
            const [volume, setVolume] = useState(2);
            const [urgency, setUrgency] = useState(3);
            const [tags, setTags] = useState({ dribble: false, dribbleMarks: false, massage: false });
            
            const fileInputRef = useRef(null);

            // --- LOAD DATA ---
            useEffect(() => {
                try {
                    const savedLogs = localStorage.getItem('tbb_logs');
                    if (savedLogs) setLogs(JSON.parse(savedLogs).map(l => ({...l, timestamp: new Date(l.timestamp)})));
                    
                    const savedDrinks = localStorage.getItem('tbb_drinks');
                    if (savedDrinks) setDrinkLogs(JSON.parse(savedDrinks).map(d => ({...d, timestamp: new Date(d.timestamp)})));

                    const savedSettings = localStorage.getItem('tbb_settings');
                    if (savedSettings) {
                        const parsed = JSON.parse(savedSettings);
                        if (parsed.trackingMode) setTrackingMode(parsed.trackingMode);
                        if (parsed.auditStartDate) setAuditStartDate(parsed.auditStartDate);
                    }
                } catch (e) { console.error("Load failed", e); }
            }, []);

            // --- SAVE DATA ---
            useEffect(() => {
                if (!showSplash) {
                    localStorage.setItem('tbb_logs', JSON.stringify(logs));
                    localStorage.setItem('tbb_drinks', JSON.stringify(drinkLogs));
                    localStorage.setItem('tbb_settings', JSON.stringify({ trackingMode, auditStartDate }));
                }
            }, [logs, drinkLogs, trackingMode, auditStartDate, showSplash]);

            // --- CALCULATIONS ---
            const getAverageInterval = () => {
                if (logs.length < 2) return 0;
                let totalDiff = 0, validIntervals = 0;
                const sorted = [...logs].sort((a, b) => a.timestamp - b.timestamp);
                
                for (let i = 1; i < sorted.length; i++) {
                    const diffMs = sorted[i].timestamp - sorted[i-1].timestamp;
                    if (diffMs < 10 * 60 * 60 * 1000) { totalDiff += diffMs; validIntervals++; }
                }
                return validIntervals > 0 ? (totalDiff / validIntervals) : 0;
            };

            const formatDuration = (ms) => {
                if (!ms) return "N/A";
                const mins = Math.floor(ms / 60000);
                const hrs = Math.floor(mins / 60);
                if (hrs === 0) return `${mins % 60}m`;
                return `${hrs}h ${mins % 60}m`;
            };

            const calculateAuditDays = () => {
                if (trackingMode === 'continuous') return "N/A";
                const today = new Date(); today.setHours(0,0,0,0);
                const start = new Date(auditStartDate); start.setHours(0,0,0,0);
                
                const diffDays = Math.ceil((start - today) / (1000 * 60 * 60 * 24));
                
                if (diffDays <= 0 && diffDays > -3) return "ACTIVE"; 
                if (diffDays <= -3) {
                    const nextStart = new Date(start); nextStart.setDate(nextStart.getDate() + 14);
                    setAuditStartDate(new Date(nextStart.getTime() - (nextStart.getTimezoneOffset() * 60000)).toISOString().slice(0, 10));
                    return 14; 
                }
                return diffDays;
            };

            // --- ACTIONS ---
            const openLogModal = () => {
                const now = new Date();
                setLogDate(new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 10));
                setLogTime(now.toTimeString().slice(0, 5));
                setVolume(2); setUrgency(3);
                setTags({ dribble: false, dribbleMarks: false, massage: false });
                setShowLogModal(true);
            };

            const saveLog = () => {
                const [year, month, day] = logDate.split('-').map(Number);
                const [hours, minutes] = logTime.split(':').map(Number);
                const dateObj = new Date(year, month - 1, day, hours, minutes);
                
                const newLog = { id: Date.now(), timestamp: dateObj, volume, urgency, tags };
                const currentAvg = getAverageInterval();
                const sortedLogs = [...logs, newLog].sort((a, b) => b.timestamp - a.timestamp);
                
                if (sortedLogs.length > 1 && sortedLogs[0].id === newLog.id) {
                    const newInterval = newLog.timestamp - sortedLogs[1].timestamp;
                    if (currentAvg > 0 && newInterval > (currentAvg + 300000) && newInterval < (10*60*60*1000)) {
                        setCelebrationMsg("🎉 New Personal Best! You held it longer than average!");
                        setTimeout(() => setCelebrationMsg(''), 4000);
                    }
                }

                setLogs(sortedLogs);
                setShowLogModal(false);
            };

            const handleLogDrink = (type) => {
                const newDrink = { id: Date.now(), timestamp: new Date(), type };
                setDrinkLogs(prev => [newDrink, ...prev].sort((a, b) => b.timestamp - a.timestamp));
                setCelebrationMsg(`✅ ${type} logged!`);
                setTimeout(() => setCelebrationMsg(''), 2000);
            };

            const handleDelete = (id, type) => {
                if (type === 'drink') setDrinkLogs(prev => prev.filter(d => d.id !== id));
                else setLogs(prev => prev.filter(l => l.id !== id));
            };

            const exportData = () => {
                const data = JSON.stringify({ logs, drinkLogs });
                const blob = new Blob([data], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = `BladderTrackerBackup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.logs) setLogs(parsed.logs.map(l => ({...l, timestamp: new Date(l.timestamp)})));
                        if (parsed.drinkLogs) setDrinkLogs(parsed.drinkLogs.map(d => ({...d, timestamp: new Date(d.timestamp)})));
                        alert("Data successfully restored!");
                    } catch (err) { alert("Error restoring data."); }
                };
                reader.readAsText(file);
            };

            const allEvents = [...logs.map(l => ({ ...l, eventType: 'visit' })), ...drinkLogs.map(d => ({ ...d, eventType: 'drink' }))]
                                .sort((a, b) => b.timestamp - a.timestamp);
            
            const displayedEvents = showAllData ? allEvents : allEvents.slice(0, 10);
            const daysUntilAudit = calculateAuditDays();

            // --- VIEWS ---
            if (showSplash) {
                return (
                    <div className="max-w-md mx-auto min-h-screen bg-blue-600 flex flex-col items-center justify-center text-white relative overflow-hidden dot-bg cursor-pointer" onClick={() => setShowSplash(false)}>
                        <div className="text-7xl mb-6 animate-bounce flex items-center justify-center gap-4">
                            <span>🚽</span>
                            <div className="flex">
                                <span>🏃‍♂️</span><span>💨</span>
                            </div>
                        </div>
                        <h1 className="text-3xl font-black text-center mb-2 px-4 drop-shadow-md">Teacher Bladder<br/>Bootcamp</h1>
                        <p className="text-blue-200 font-medium tracking-wide">Operation Bladder Trainer</p>
                        <div className="mt-16 text-sm text-white/80 animate-pulse font-bold tracking-widest uppercase bg-white/20 px-6 py-3 rounded-full">Tap anywhere to start</div>
                    </div>
                );
            }

            return (
                <>
                    {/* --- PRINT ONLY VIEW --- */}
                    <div id="print-view" className="hidden print:block p-8 font-sans max-w-4xl mx-auto text-black bg-white">
                        <div className="border-b-2 border-gray-800 pb-4 mb-6">
                            <h1 className="text-3xl font-black text-gray-900">Operation Bladder Trainer</h1>
                            <h2 className="text-xl text-gray-600 font-medium">Clinical Data Report</h2>
                            <p className="text-sm text-gray-500 mt-2">Generated: {new Date().toLocaleDateString()}</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-8">
                            <div className="p-4 border rounded-lg bg-gray-50">
                                <p className="text-sm text-gray-600 font-bold uppercase">Average Hold Interval</p>
                                <p className="text-2xl font-black">{formatDuration(getAverageInterval())}</p>
                            </div>
                            <div className="p-4 border rounded-lg bg-gray-50">
                                <p className="text-sm text-gray-600 font-bold uppercase">Total Visits</p>
                                <p className="text-2xl font-black">{logs.length}</p>
                            </div>
                        </div>
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-100 text-gray-700 text-sm">
                                    <th className="p-3 border font-bold">Date & Time</th>
                                    <th className="p-3 border font-bold">Event Type</th>
                                    <th className="p-3 border font-bold">Interval</th>
                                    <th className="p-3 border font-bold">Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                {allEvents.map((event) => {
                                    const dateStr = event.timestamp.toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                                    if (event.eventType === 'drink') {
                                        return (
                                            <tr key={event.id} className="border-b">
                                                <td className="p-3 border text-sm">{dateStr}</td>
                                                <td className="p-3 border text-sm text-gray-600">Drink</td>
                                                <td className="p-3 border text-sm text-gray-400">-</td>
                                                <td className="p-3 border text-sm font-medium">{event.type}</td>
                                            </tr>
                                        );
                                    }
                                    const visitsOnly = [...logs].sort((a, b) => b.timestamp - a.timestamp);
                                    const visitIndex = visitsOnly.findIndex(v => v.id === event.id);
                                    const prevLog = visitsOnly[visitIndex + 1];
                                    const interval = prevLog ? formatDuration(event.timestamp - prevLog.timestamp) : 'Initial';
                                    let t = [];
                                    if (event.tags.dribble) t.push("Dribble");
                                    if (event.tags.dribbleMarks) t.push("Marks Clothes");
                                    if (event.tags.massage) t.push("Massage");
                                    return (
                                        <tr key={event.id} className="border-b bg-gray-50/50">
                                            <td className="p-3 border text-sm font-medium">{dateStr}</td>
                                            <td className="p-3 border text-sm font-bold text-gray-800">Toilet Visit</td>
                                            <td className="p-3 border text-sm font-bold text-blue-800">{interval}</td>
                                            <td className="p-3 border text-sm">
                                                Urg: {event.urgency}/5 | Vol: {event.volume === 1 ? 'Sm' : event.volume === 2 ? 'Med' : 'Lg'} 
                                                {t.length > 0 ? ` | Tags: ${t.join(', ')}` : ''}
                                            </td>
                                        </tr>
                                    )
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* --- MOBILE APP UI --- */}
                    <div id="mobile-app-ui" className="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col relative shadow-xl overflow-hidden text-gray-800 print:hidden">
                        {celebrationMsg && (
                            <div className="absolute top-4 left-4 right-4 z-50 bg-green-500 text-white font-bold px-4 py-3 rounded-xl shadow-lg flex items-center justify-center animate-pulse">
                                {celebrationMsg}
                            </div>
                        )}

                        {/* SIDEBAR */}
                        {isSidebarOpen && (
                            <div className="absolute inset-0 z-40 flex">
                                <div className="absolute inset-0 bg-black/50" onClick={() => setIsSidebarOpen(false)}></div>
                                <div className="relative w-64 bg-white h-full shadow-2xl flex flex-col z-50 slide-right">
                                    <div className="p-6 bg-blue-600 text-white flex justify-between items-start">
                                        <div>
                                            <h2 className="text-xl font-bold">Menu</h2>
                                            <p className="text-blue-200 text-sm">{daysUntilAudit} days to next audit</p>
                                        </div>
                                        <button onClick={() => setIsSidebarOpen(false)} className="text-white p-1">
                                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </button>
                                    </div>
                                    <div className="flex flex-col py-4 space-y-2 px-3 flex-1 overflow-y-auto hide-scrollbar">
                                        {[
                                            { id: 'logs', icon: '📝', label: 'Dashboard' },
                                            { id: 'calendar', icon: '📅', label: 'Calendar Schedule' },
                                            { id: 'report', icon: '📊', label: 'Analysis Report' },
                                            { id: 'table', icon: '📋', label: 'Data Table View' },
                                            { id: 'progress', icon: '💾', label: 'Data & Export' }
                                        ].map(tab => (
                                            <button 
                                                key={tab.id}
                                                onClick={() => { setActiveTab(tab.id); setIsSidebarOpen(false); }}
                                                className={`flex items-center p-3 rounded-xl transition ${activeTab === tab.id ? 'bg-blue-50 text-blue-700 font-bold' : 'text-gray-600 hover:bg-gray-100'}`}
                                            >
                                                <span className="text-2xl mr-4">{tab.icon}</span>{tab.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* HEADER */}
                        <header className="bg-white px-4 py-4 flex items-center justify-between shadow-sm z-10 sticky top-0">
                            <button onClick={() => setIsSidebarOpen(true)} className="p-2 -ml-2 text-gray-800 hover:bg-gray-100 rounded-lg">
                                <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            </button>
                            <h1 className="text-lg font-bold text-gray-800 tracking-tight capitalize">
                                {activeTab === 'logs' ? 'Dashboard' : activeTab === 'progress' ? 'Data & Export' : activeTab === 'table' ? 'Data Table' : activeTab === 'report' ? 'Analysis' : 'Calendar'}
                            </h1>
                            <div className="w-8"></div>
                        </header>

                        {/* MAIN CONTENT AREA */}
                        <main className="flex-1 overflow-y-auto p-4 pb-12 hide-scrollbar">
                            
                            {/* DASHBOARD TAB */}
                            {activeTab === 'logs' && (
                                <div className="space-y-6">
                                    <button onClick={openLogModal} className="w-full bg-blue-600 text-white py-5 rounded-2xl shadow-lg font-black text-xl active:scale-95 transition flex items-center justify-center space-x-3 border-b-4 border-blue-800">
                                        <span className="text-2xl">🚽</span><span>Log Toilet Visit</span>
                                    </button>

                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                        <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Quick Add Drink</h3>
                                        <div className="grid grid-cols-3 gap-2">
                                            {DRINKS_MENU.map(drink => (
                                                <button 
                                                    key={drink.type} onClick={() => handleLogDrink(drink.type)} 
                                                    className={`py-3 ${drink.bg} border rounded-xl font-bold flex flex-col items-center justify-center space-y-1 active:scale-95 transition text-center px-1`}
                                                >
                                                    <span className="text-xl">{drink.icon}</span>
                                                    <span className={`text-[10px] leading-tight ${drink.color}`}>{drink.type}</span>
                                                    <span className="text-[9px] text-gray-500 font-medium">{drink.vol}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-baseline mb-4 px-1">
                                            <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Recent Activity</h3>
                                            <span className="text-[10px] text-gray-400 italic">Swipe left to delete</span>
                                        </div>
                                        
                                        {displayedEvents.length === 0 ? (
                                            <div className="text-center py-10 bg-white rounded-xl border border-dashed border-gray-300 text-gray-400">No activity logged yet.</div>
                                        ) : (
                                            <div className="space-y-3">
                                                {displayedEvents.map((event) => {
                                                    const timeStr = event.timestamp.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                                    
                                                    if (event.eventType === 'drink') {
                                                        const dInfo = DRINKS_MENU.find(d => d.type === event.type) || DRINKS_MENU[0];
                                                        return (
                                                            <SwipeableLog key={`drink-${event.id}`} onDelete={() => handleDelete(event.id, 'drink')} bgClass="bg-white">
                                                                <div className={`p-3 flex justify-between items-center border rounded-xl h-full ${dInfo.bg}`}>
                                                                    <div className="flex items-center space-x-3">
                                                                        <div className="bg-white p-2 rounded-lg shadow-sm text-lg">{dInfo.icon}</div>
                                                                        <div className="flex flex-col">
                                                                            <span className={`font-bold ${dInfo.color} leading-tight`}>{event.type}</span>
                                                                            <span className="text-[10px] text-gray-500 font-medium">{dInfo.vol}</span>
                                                                        </div>
                                                                    </div>
                                                                    <span className="text-sm font-medium text-gray-500">{timeStr}</span>
                                                                </div>
                                                            </SwipeableLog>
                                                        );
                                                    }

                                                    const visitsOnly = [...logs].sort((a, b) => b.timestamp - a.timestamp);
                                                    const visitIndex = visitsOnly.findIndex(v => v.id === event.id);
                                                    const prevLog = visitsOnly[visitIndex + 1];
                                                    const interval = prevLog ? (event.timestamp - prevLog.timestamp) : null;
                                                    
                                                    return (
                                                        <SwipeableLog key={`visit-${event.id}`} onDelete={() => handleDelete(event.id, 'visit')} bgClass="bg-white">
                                                            <div className="p-4 flex flex-col border border-gray-200 rounded-xl h-full">
                                                                <div className="flex justify-between items-start mb-2">
                                                                    <div className="flex items-center space-x-2">
                                                                        <span className="text-xl">🚽</span>
                                                                        <div className="font-bold text-lg text-gray-800">{timeStr}</div>
                                                                    </div>
                                                                    <div className="text-sm font-bold bg-gray-100 px-2 py-1 rounded text-gray-600">{interval ? formatDuration(interval) : 'Initial'}</div>
                                                                </div>
                                                                <div className="flex items-center space-x-4 text-sm mb-2 ml-7">
                                                                    <div className="flex items-center space-x-1">
                                                                        <span className="text-gray-500">Urgency:</span>
                                                                        <span className={`font-bold px-2 rounded ${event.urgency >= 4 ? 'text-red-600 bg-red-50' : event.urgency === 3 ? 'text-orange-600 bg-orange-50' : 'text-green-600 bg-green-50'}`}>{event.urgency}/5</span>
                                                                    </div>
                                                                    <div className="flex items-center space-x-1">
                                                                        <span className="text-gray-500">Vol:</span>
                                                                        <span className="font-semibold text-gray-700">{event.volume === 1 ? 'Small' : event.volume === 2 ? 'Med' : 'Large'}</span>
                                                                    </div>
                                                                </div>
                                                                {(event.tags.dribble || event.tags.dribbleMarks || event.tags.massage) && (
                                                                    <div className="flex flex-wrap gap-2 mt-1 pt-2 border-t border-gray-50 ml-7">
                                                                        {event.tags.dribble && <span className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-md font-bold">💧 Dribble</span>}
                                                                        {event.tags.dribbleMarks && <span className="text-xs bg-red-50 text-red-700 px-2 py-1 rounded-md font-bold">👖 Marks Clothes</span>}
                                                                        {event.tags.massage && <span className="text-xs bg-purple-50 text-purple-700 px-2 py-1 rounded-md font-bold">💆‍♂️ Massage</span>}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </SwipeableLog>
                                                    )
                                                })}

                                                {allEvents.length > 10 && (
                                                    <button onClick={() => setShowAllData(!showAllData)} className="w-full py-3 mt-4 text-sm font-bold text-gray-500 bg-gray-200 rounded-xl hover:bg-gray-300 transition-colors">
                                                        {showAllData ? "Show Less" : `View All ${allEvents.length} Logs`}
                                                    </button>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* ANALYSIS REPORT TAB */}
                            {activeTab === 'report' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-2xl shadow-md text-white">
                                        <h2 className="text-xl font-black mb-1">Progress Analysis</h2>
                                        <p className="text-indigo-200 text-sm">Based on your {logs.length} logged visits</p>
                                    </div>
                                    {logs.length < 5 ? (
                                        <div className="text-center py-10 bg-white rounded-xl border border-dashed border-gray-300 text-gray-400">Keep logging! More data needed for analysis.</div>
                                    ) : (
                                        <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 space-y-4">
                                            <h3 className="font-bold text-gray-800 border-b pb-2">Habits & Symptoms</h3>
                                            <div className="flex justify-between items-center"><span className="text-gray-600 font-medium">💧 Any Dribble</span><span className="font-black text-blue-600">{Math.round((logs.filter(l => l.tags.dribble || l.tags.dribbleMarks).length / logs.length) * 100)}%</span></div>
                                            <div className="flex justify-between items-center"><span className="text-gray-600 font-medium">💆‍♂️ Massage Technique</span><span className="font-black text-purple-600">{Math.round((logs.filter(l => l.tags.massage).length / logs.length) * 100)}%</span></div>
                                            <div className="flex justify-between items-center"><span className="text-gray-600 font-medium">🚨 High Urgency (4-5)</span><span className="font-black text-red-600">{Math.round((logs.filter(l => l.urgency >= 4).length / logs.length) * 100)}%</span></div>
                                            
                                            <div className="mt-6 pt-4 border-t border-gray-100">
                                                <h3 className="font-bold text-gray-800 mb-2">💡 Clinical Insights</h3>
                                                <ul className="list-disc pl-5 text-sm text-gray-600 space-y-2">
                                                    <li>Your current average hold time is <strong className="text-gray-800">{formatDuration(getAverageInterval())}</strong>.</li>
                                                    {logs.filter(l => l.tags.massage).length > 0 && <li>Great job using the massage technique! Keep monitoring if this lowers your dribble percentage.</li>}
                                                    <li>Try swapping one daily caffeinated drink for Water or Milk to see if your urgency scores decrease.</li>
                                                </ul>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* CALENDAR SCHEDULE TAB */}
                            {activeTab === 'calendar' && (
                                <div className="space-y-6">
                                    <div className={`bg-gradient-to-br ${daysUntilAudit === 'ACTIVE' ? 'from-green-500 to-green-700' : 'from-blue-600 to-blue-800'} p-6 rounded-2xl shadow-md text-white text-center transition-colors`}>
                                        <p className="text-white/80 font-medium mb-1 uppercase tracking-widest text-xs">{trackingMode === 'continuous' ? 'Continuous Tracking' : 'Next 3-Day Audit Window'}</p>
                                        <div className="text-6xl font-black mb-2">{daysUntilAudit === 'ACTIVE' ? 'NOW' : daysUntilAudit}</div>
                                        <p className="text-lg font-bold">{daysUntilAudit === 'ACTIVE' ? 'Log everything for 3 days!' : trackingMode === 'continuous' ? 'Always Active' : 'Days Remaining'}</p>
                                    </div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                        <h3 className="font-bold text-gray-800 mb-4">Tracking Schedule</h3>
                                        <p className="text-sm text-gray-500 mb-6">Urologists often recommend a "3-day bladder diary" every fortnight to prevent tracking fatigue.</p>
                                        <div className="space-y-4">
                                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setTrackingMode('scheduled')}>
                                                <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${trackingMode === 'scheduled' ? 'border-blue-600' : 'border-gray-300'}`}>
                                                    {trackingMode === 'scheduled' && <div className="w-2.5 h-2.5 bg-blue-600 rounded-full"></div>}
                                                </div>
                                                <label className="font-bold text-gray-700 cursor-pointer">3-Day Fortnightly Audit</label>
                                            </div>
                                            {trackingMode === 'scheduled' && (
                                                <div className="ml-8 bg-gray-50 p-3 rounded-xl border border-gray-200">
                                                    <label className="block text-xs font-bold text-gray-400 uppercase mb-1">Next Audit Start Date</label>
                                                    <input type="date" value={auditStartDate} onChange={(e) => setAuditStartDate(e.target.value)} className="w-full text-lg font-bold bg-transparent outline-none text-gray-800 cursor-pointer"/>
                                                </div>
                                            )}
                                            <div className="flex items-center space-x-3 cursor-pointer pt-2" onClick={() => setTrackingMode('continuous')}>
                                                <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${trackingMode === 'continuous' ? 'border-blue-600' : 'border-gray-300'}`}>
                                                    {trackingMode === 'continuous' && <div className="w-2.5 h-2.5 bg-blue-600 rounded-full"></div>}
                                                </div>
                                                <label className="font-bold text-gray-700 cursor-pointer">Continuous Tracking</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* DATA TABLE TAB */}
                            {activeTab === 'table' && (
                                <div className="space-y-4">
                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                                        <h3 className="font-bold text-gray-800 mb-4">Complete Data Log</h3>
                                        <table className="w-full text-left border-collapse min-w-[300px]">
                                            <thead>
                                                <tr className="bg-gray-50 text-gray-600 text-xs uppercase tracking-wider">
                                                    <th className="p-2 border-b font-bold">Date & Time</th>
                                                    <th className="p-2 border-b font-bold">Type</th>
                                                    <th className="p-2 border-b font-bold">Details</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {allEvents.map((event) => {
                                                    const dateStr = event.timestamp.toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                                                    if (event.eventType === 'drink') {
                                                        const dInfo = DRINKS_MENU.find(d => d.type === event.type) || { vol: '' };
                                                        return (
                                                            <tr key={event.id} className="border-b">
                                                                <td className="p-2 border-b text-xs text-gray-600 whitespace-nowrap">{dateStr}</td>
                                                                <td className="p-2 border-b text-xs text-blue-600 font-bold">Drink</td>
                                                                <td className="p-2 border-b text-xs text-gray-800">{event.type} <span className="text-gray-500">({dInfo.vol})</span></td>
                                                            </tr>
                                                        );
                                                    }
                                                    
                                                    const visitsOnly = [...logs].sort((a, b) => b.timestamp - a.timestamp);
                                                    const visitIndex = visitsOnly.findIndex(v => v.id === event.id);
                                                    const prevLog = visitsOnly[visitIndex + 1];
                                                    const interval = prevLog ? formatDuration(event.timestamp - prevLog.timestamp) : 'Initial';
                                                    
                                                    let t = [];
                                                    if (event.tags.dribble) t.push("Dribble");
                                                    if (event.tags.dribbleMarks) t.push("Marks");
                                                    if (event.tags.massage) t.push("Massage");
                                                    
                                                    return (
                                                        <tr key={event.id} className="border-b bg-gray-50/30">
                                                            <td className="p-2 border-b text-xs text-gray-800 font-medium whitespace-nowrap">{dateStr}</td>
                                                            <td className="p-2 border-b text-xs text-orange-600 font-bold">Visit</td>
                                                            <td className="p-2 border-b text-xs text-gray-700">
                                                                Hold: <b>{interval}</b><br/>
                                                                Urg: {event.urgency}/5, Vol: {event.volume === 1 ? 'Sm' : event.volume === 2 ? 'Med' : 'Lg'}
                                                                {t.length > 0 && <span><br/>Tags: {t.join(', ')}</span>}
                                                            </td>
                                                        </tr>
                                                    )
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* DATA & EXPORT TAB (Previously Progress) */}
                            {activeTab === 'progress' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white p-4 rounded-xl shadow-sm border border-blue-100">
                                            <p className="text-xs text-blue-500 font-bold uppercase mb-1">Avg Interval</p>
                                            <p className="text-2xl font-black text-gray-800">{formatDuration(getAverageInterval())}</p>
                                        </div>
                                        <div className="bg-white p-4 rounded-xl shadow-sm border border-green-100">
                                            <p className="text-xs text-green-500 font-bold uppercase mb-1">Total Logs</p>
                                            <p className="text-2xl font-black text-gray-800">{logs.length}</p>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                                        <h3 className="font-bold text-gray-800 mb-4">Data Management</h3>
                                        <p className="text-sm text-gray-500 mb-6">Manage your local data backups or print your clinical report.</p>
                                        
                                        <div className="space-y-3">
                                            {/* PDF PRINT BUTTON */}
                                            <button onClick={() => window.print()} className="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl flex items-center justify-center shadow-md transition-colors">
                                                <span className="mr-2">🖨️</span> Export as PDF (Print)
                                            </button>
                                            
                                            <button onClick={exportData} className="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl flex items-center justify-center border border-gray-200 transition-colors">
                                                <span className="mr-2">💾</span> Download Backup File
                                            </button>
                                            
                                            <div className="relative">
                                                <input 
                                                    type="file" 
                                                    ref={fileInputRef}
                                                    onChange={importData}
                                                    accept=".json"
                                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                                />
                                                <button className="w-full py-3 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl flex items-center justify-center transition-colors">
                                                    <span className="mr-2">📂</span> Restore From Backup
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>

                        {/* --- LOG MODAL OVERLAY --- */}
                        {showLogModal && (
                            <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 sm:items-center">
                                <div className="bg-white w-full max-w-md p-6 rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto slide-up">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-xl font-black text-gray-800">Log Toilet Visit</h2>
                                        <button onClick={() => setShowLogModal(false)} className="text-gray-400 bg-gray-100 rounded-full p-2 hover:bg-gray-200">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                        </button>
                                    </div>

                                    <div className="space-y-6">
                                        {/* DATE & TIME EDITOR */}
                                        <div className="flex space-x-3">
                                            <div className="flex-1 bg-gray-50 py-3 px-2 rounded-2xl border-2 border-gray-100">
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 text-center">Date</label>
                                                <input type="date" value={logDate} onChange={(e) => setLogDate(e.target.value)} className="w-full text-lg font-black text-center bg-transparent outline-none text-gray-800 cursor-pointer"/>
                                            </div>
                                            <div className="flex-1 bg-gray-50 py-3 px-2 rounded-2xl border-2 border-gray-100">
                                                <label className="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 text-center">Time</label>
                                                <input type="time" value={logTime} onChange={(e) => setLogTime(e.target.value)} className="w-full text-lg font-black text-center bg-transparent outline-none text-gray-800 cursor-pointer"/>
                                            </div>
                                        </div>

                                        {/* SLIDERS */}
                                        <div>
                                            <div className="flex justify-between text-sm font-bold text-gray-700 mb-2"><label>Volume</label><span className="text-blue-600">{volume === 1 ? 'Small' : volume === 2 ? 'Medium' : 'Large'}</span></div>
                                            <input type="range" min="1" max="3" step="1" value={volume} onChange={(e) => setVolume(parseInt(e.target.value))} className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                                            <div className="flex justify-between text-xs text-gray-400 mt-2 px-1"><span>Small</span><span>Med</span><span>Large</span></div>
                                        </div>
                                        <div>
                                            <div className="flex justify-between text-sm font-bold text-gray-700 mb-2"><label>Urgency Level</label><span className={urgency >= 4 ? 'text-red-600' : urgency === 3 ? 'text-orange-600' : 'text-green-600'}>{urgency}/5</span></div>
                                            <input type="range" min="1" max="5" step="1" value={urgency} onChange={(e) => setUrgency(parseInt(e.target.value))} className={`w-full h-2 rounded-lg appearance-none cursor-pointer ${urgency >= 4 ? 'accent-red-500 bg-red-100' : urgency === 3 ? 'accent-orange-500 bg-orange-100' : 'accent-green-500 bg-green-100'}`} />
                                            <div className="flex justify-between text-xs text-gray-400 mt-2 px-1"><span>Mild</span><span>Rush</span></div>
                                        </div>

                                        {/* TAGS */}
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-3">Quick Tags</label>
                                            <div className="grid grid-cols-3 gap-2">
                                                <button onClick={() => setTags({...tags, dribble: !tags.dribble})} className={`py-3 rounded-xl border text-sm font-bold flex flex-col items-center justify-center transition-colors ${tags.dribble ? 'bg-blue-100 border-blue-300 text-blue-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}><span className="text-xl mb-1">💧</span> Dribble</button>
                                                <button onClick={() => setTags({...tags, dribbleMarks: !tags.dribbleMarks})} className={`py-3 rounded-xl border text-xs font-bold flex flex-col items-center justify-center transition-colors text-center px-1 ${tags.dribbleMarks ? 'bg-red-100 border-red-300 text-red-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}><span className="text-xl mb-1">👖</span> Marks Clothes</button>
                                                <button onClick={() => setTags({...tags, massage: !tags.massage})} className={`py-3 rounded-xl border text-sm font-bold flex flex-col items-center justify-center transition-colors ${tags.massage ? 'bg-purple-100 border-purple-300 text-purple-800' : 'bg-gray-50 border-gray-200 text-gray-500'}`}><span className="text-xl mb-1">💆‍♂️</span> Massage</button>
                                            </div>
                                        </div>

                                        <button onClick={saveLog} className="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg active:scale-95 transition shadow-lg mt-4 border-b-4 border-blue-800">Save Log</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
